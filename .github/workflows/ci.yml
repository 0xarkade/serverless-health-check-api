name: ci

on:
  pull_request:
  push:
    branches: [main]

# The default token is read only. This workflow never needs to write to the
# repository, and it never touches AWS.
permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: check formatting
        run: terraform fmt -check -recursive

      # -backend=false means no credentials and no state access, so these
      # checks are safe to run on a pull request from anywhere.
      - name: validate bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

      - name: validate infra
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: scan terraform for misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: scan lambda dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: src/health_check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
